name: Sync Vercel env vars & deploy

# Corre cuando:
#  - se mergea algo a main (todas las veces, idempotente)
#  - se dispara manualmente desde la pestaña Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID:            prj_HO06WJzYyQMwZZBM3SsLqUuTTaKe
      TEAM_ID:               team_S8eJgKsO9PkTc62ubPU9RYC1
      SUPABASE_URL:          https://bzvfydkqpkcqfnuuyagt.supabase.co
      SUPABASE_SERVICE_KEY:  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6dmZ5ZGtxcGtjcWZudXV5YWd0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODUwNjE1NSwiZXhwIjoyMDk0MDgyMTU1fQ.sxPnt0N_3Pz_ViwLXs3EvA6XP323-OBYh4djkSOfz30"
      ADMIN_EMAIL_VAL:       victorhugo@vhfbelen.com.ar
      ADMIN_PASSWORD_VAL:    T8hiJ0AgI4uWuMzLxgqk
      ADMIN_JWT_SECRET_VAL:  "cQRCTXimp63NJaRGVyIcE1crFzk3i3NjYCtJba/lopD3J0LceISPNdx/MzU+0hft"
    steps:
      - name: Fetch VERCEL_TOKEN
        run: |
          set -euo pipefail
          # Preferir GitHub Secret si está presente; si no, leer de Supabase
          TKN="${{ secrets.VERCEL_TOKEN }}"
          if [ -z "$TKN" ]; then
            echo "Secret no presente, leyendo de Supabase..."
            RESP=$(curl -fsS \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "$SUPABASE_URL/rest/v1/_vhf_deploy_secrets?key=eq.VERCEL_TOKEN&select=value")
            TKN=$(echo "$RESP" | jq -r '.[0].value // ""')
          fi
          if [ -z "$TKN" ]; then
            echo "::error::No se encontró VERCEL_TOKEN ni en GitHub Secret ni en Supabase."
            exit 1
          fi
          echo "::add-mask::$TKN"
          echo "VTOKEN=$TKN" >> $GITHUB_ENV
          echo "  ✓ Token resuelto (len=${#TKN})"

      - name: Sync env vars in Vercel
        run: |
          set -euo pipefail
          API="https://api.vercel.com"

          set_env() {
            local key="$1"
            local value="$2"
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: Bearer $VTOKEN" \
              "$API/v9/projects/$PROJECT_ID/env/$key?teamId=$TEAM_ID" || true

            local body
            body=$(jq -n --arg k "$key" --arg v "$value" \
              '{key:$k, value:$v, type:"encrypted", target:["production","preview","development"]}')

            local http
            http=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $VTOKEN" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$API/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&upsert=true")

            if [ "$http" -ge 200 ] && [ "$http" -lt 300 ]; then
              echo "  ✓ $key"
            else
              echo "  ❌ $key (HTTP $http)"
              cat /tmp/resp; echo
              return 1
            fi
          }

          echo "🔐 Seteando env vars en Vercel..."
          set_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_KEY"
          set_env "ADMIN_EMAIL"               "$ADMIN_EMAIL_VAL"
          set_env "ADMIN_PASSWORD"            "$ADMIN_PASSWORD_VAL"
          set_env "ADMIN_JWT_SECRET"          "$ADMIN_JWT_SECRET_VAL"
          echo "✅ Env vars OK"

      - name: Trigger production redeploy
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'workflow dispatch' }}
        run: |
          set -euo pipefail
          API="https://api.vercel.com"

          echo "🚀 Disparando deploy del commit $COMMIT_SHA..."

          BODY=$(jq -n \
            --arg name "vhfdecants" \
            --arg sha "$COMMIT_SHA" \
            --arg msg "$COMMIT_MSG" \
            '{
              name: $name,
              target: "production",
              gitSource: {
                type: "github",
                repoId: 1135565950,
                ref: "main",
                sha: $sha
              },
              meta: {
                githubCommitMessage: $msg,
                action: "synced-by-actions"
              }
            }')

          HTTP=$(curl -s -o /tmp/dr -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VTOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API/v13/deployments?teamId=$TEAM_ID&forceNew=1&skipAutoDetectionConfirmation=1")

          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            URL=$(jq -r '.url' /tmp/dr)
            echo "✅ Deploy disparado: https://$URL"
            echo "   Producción: https://vhfdecants.vercel.app/"
            echo "   Inspector: https://vercel.com/facundos-projects-c06acd1c/vhfdecants"
          else
            echo "❌ Deploy falló (HTTP $HTTP)"
            cat /tmp/dr
            exit 1
          fi
